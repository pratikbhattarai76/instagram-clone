<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" type="image/png" href="images/instagram.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="profile">
        <img class="profile-pic" src="images/profile.jpg" alt="Profile Picture">
        <div class="info">
            <h1>p_ratik76 <button class="settings"> <img src="images/setting.png" alt=""> </button></h1>
       
            <p class="name">Pratik</p>

            <p class="details">
                <span><b>9</b> posts</span>
                <span><b>109</b> followers</span>
                <span><b>119</b> following</span>
            </p>

            <p class="bio">The Dilemma yet to be Solved!</p>
        </div>
        <div class="buttons"> 
            <button> Edit Profile</button>
            <button>View Archive</button>
        </div>
    </div>

    <div class="tabs">
        <span> <img src="images/dial.png" alt=""></span>
        <span> <img src="images/player.png" alt=""></span>
        <span> <img src="images/bookmark-white.png" alt=""></span>
        <span> <img src="images/repost.png" alt=""></span>
        <span> <img src="images/user.png" alt=""></span>
    </div>
</body>
</html>
